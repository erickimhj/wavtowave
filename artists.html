*{box-sizing:border-box}
body{margin:0;background:#0e0e10;color:#e8e8ea;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:48px 16px 64px}

.label{font-size:12px;letter-spacing:.18em;color:#8a8a93;margin:0 0 14px;font-weight:600}
.section{margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{border:1px solid #232329;border-radius:12px;padding:22px 16px 18px;background:#151518;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.photo{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#222227;display:flex;align-items:center;justify-content:center;font-size:40px;color:#8a8a93;flex-shrink:0}
.name{font-weight:600;font-size:16px;word-break:break-all}
.mail{font-size:12px;color:#8a8a93;text-decoration:none;word-break:break-all}
.mail:hover{color:#e8e8ea;text-decoration:underline}
.head .card{flex-direction:row;flex-wrap:wrap;justify-content:center;text-align:left;gap:24px;padding:28px 24px}
.head .photo{width:160px;height:160px;font-size:56px}
.head .info{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}
.head .name{font-size:24px}
@media (max-width:520px){.head .card{text-align:center}.head .info{align-items:center}}
.btn{padding:9px 16px;border-radius:999px;border:1px solid #2c2c33;color:#e8e8ea;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{background:#222227}
.sp{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:10px;color:#e8e8ea;font-size:13px;text-decoration:none;opacity:.85;transition:opacity .2s}
.sp:hover{opacity:1}
.sp img{width:26px;height:26px;display:block}
.sp svg{width:24px;height:24px;display:block}
.links{display:flex;align-items:center;justify-content:center;gap:2px}
.head .links{justify-content:flex-start}
@media (max-width:520px){.head .links{justify-content:center}}
.msg{color:#8a8a93;padding:20px 0}
.home{color:inherit;text-decoration:none;transition:color .3s}
.home:hover{color:#FFFFFF}
.home{display:inline-block;view-transition-name:wtw-logo}

<section class="section" id="artistSec">
  <p class="label" id="artistLabel" hidden>ARTISTS</p>
  <div class="grid" id="list"><p class="msg">불러오는 중...</p></div>
</section>
</div>
<script>
// 구글 시트를 "웹에 게시(CSV)"한 링크를 따옴표 안에 넣으면 됩니다.
var ARTIST_SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjPezBbHYtf8v2DaQJN0IDbRAXX_GpPsnjsetFzSvAz0JPGmaJVq_qfTdZ7HqMKKt8_CE3jO_uK_EK/pub?gid=660942977&single=true&output=csv';

function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!='\r')f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}
function esc(s){return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
// 구글 드라이브 링크면 이미지로 보이는 주소로 바꾸고, 아니면 그대로 사용
function photoUrl(u){
  u=(u||'').trim(); if(!u) return '';
  var m=u.match(/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]+)/);
  return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w320':u;
}
function card(a,isHead){
  var img=a.pic?'<img class="photo" src="'+esc(a.pic)+'" alt="'+esc(a.name)+'">'
               :'<span class="photo" aria-hidden="true">'+esc(a.name.charAt(0).toUpperCase())+'</span>';
  var btn=/^https:\/\/open\.spotify\.com\//.test(a.sp)
    ?'<a class="sp" href="'+esc(a.sp)+'" target="_blank" rel="noopener" aria-label="'+esc(a.name)+' Spotify"><img src="spotify.png" alt="Spotify" onerror="this.replaceWith(document.createTextNode(\'spotify\'))"></a>':'';
  var ig=a.ig?'<a class="sp" href="'+esc(a.ig)+'" target="_blank" rel="noopener" aria-label="'+esc(a.name)+' Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></a>':'';
  var links=(btn||ig)?'<div class="links">'+btn+ig+'</div>':'';
  var mail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.mail)?'<a class="mail" href="mailto:'+esc(a.mail)+'">'+esc(a.mail)+'</a>':'';
  var body='<div class="name">'+esc(a.name)+'</div>'+links+mail;
  return '<div class="card">'+img+(isHead?'<div class="info">'+body+'</div>':body)+'</div>';
}
// 가장 긴 메일 주소가 한 줄에 들어가는 만큼만 카드 최소 너비를 늘림 (화면보다 넓어지지는 않음)
function fitCards(){
  var grid=document.getElementById('list'),w=0;
  var probe=document.createElement('span');
  probe.className='mail';probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap';
  document.body.appendChild(probe);
  grid.querySelectorAll('.mail').forEach(function(m){probe.textContent=m.textContent;w=Math.max(w,probe.getBoundingClientRect().width)});
  probe.remove();
  var min=Math.min(Math.max(180,Math.ceil(w)+36),grid.clientWidth);
  grid.style.gridTemplateColumns='repeat(auto-fill,minmax('+min+'px,1fr))';
}
// 인스타 칸에 전체 주소 또는 아이디(@아이디)를 적으면 인스타 주소로 바꿈
function igUrl(u){
  u=(u||'').trim(); if(!u) return '';
  if(/^https?:\/\/(www\.)?instagram\.com\//i.test(u)) return u.replace(/^http:/i,'https:');
  u=u.replace(/^@/,'');
  return /^[\w.]+$/.test(u)?'https://www.instagram.com/'+u+'/':'';
}
function show(html){document.getElementById('list').innerHTML=html}

// 지난번에 받아둔 목록을 먼저 바로 보여주고, 그사이 최신 목록을 받아와 바뀐 게 있으면 교체
function cached(key,url,load,fail){var c=null;try{c=localStorage.getItem(key)}catch(e){}
if(c){try{load(c)}catch(e){c=null}}
fetch(url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
if(t!==c){try{localStorage.setItem(key,t)}catch(e){}load(t)}}).catch(function(){if(!c)fail()})}
if(!ARTIST_SHEET){
  show('<p class="msg">아티스트 목록을 준비 중입니다.</p>');
}else{
  cached('wtw_artists',ARTIST_SHEET,function(txt){
    var rows=parseCSV(txt.replace(/^﻿/,''));
    var head=rows.shift().map(function(s){return s.trim()});
    var ni=head.indexOf('이름'),pi=head.indexOf('사진'),si=head.indexOf('스포티파이'),ki=head.indexOf('구분'),mi=head.indexOf('메일'),gi=head.indexOf('인스타');
    var heads=[],artists=[];
    rows.forEach(function(r){
      var name=(r[ni]||'').trim(); if(!name) return;
      var a={name:name,pic:photoUrl(r[pi]),sp:(r[si]||'').trim(),mail:mi<0?'':(r[mi]||'').trim(),ig:gi<0?'':igUrl(r[gi])};
      var kind=ki<0?'':(r[ki]||'').replace(/\s/g,'').toLowerCase();
      (kind==='headproducer'?heads:artists).push(a);
    });
    document.getElementById('head').innerHTML=heads.map(function(a){return card(a,true)}).join('');
    document.getElementById('headSec').hidden=!heads.length;
    document.getElementById('artistLabel').hidden=!heads.length;
    show(artists.length?artists.map(function(a){return card(a,false)}).join('')
                       :'<p class="msg">아직 등록된 아티스트가 없습니다.</p>');
    fitCards();
  },function(){show('<p class="msg">아티스트 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>')});
  window.addEventListener('resize',fitCards);
}
</script>

</body>
</html>
