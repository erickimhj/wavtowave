<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wavtowave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap">
<style>
html,body{margin:0;height:100%}
body{
  background:#0e0e10;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
}
.logo{
  font-family:'Libre Caslon Display',Georgia,serif;
  font-weight:400;
  font-size:clamp(52px,13vw,168px);
  letter-spacing:-0.01em;
  line-height:1;
  color:#D8D2C4;
  text-decoration:none;
  filter:url(#thin);
  padding:24px;
  opacity:0;
  animation:fade 1.6s ease forwards;
  transition:color .4s ease;
}
.logo:hover{color:#FFFFFF}
.logo:focus-visible{outline:1px solid #D8D2C4;outline-offset:8px}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="thin" x="-5%" y="-20%" width="110%" height="140%">
    <feMorphology id="erode" operator="erode" radius="1.5"></feMorphology>
  </filter>
</svg>

<a class="logo" href="songs.html" aria-label="wavtowave - 곡 목록으로 이동">wavtowave</a>

<script>
// 화면 크기에 맞춰 글자 얇기도 같은 비율로 조절
(function(){
  var logo=document.querySelector('.logo');
  var erode=document.getElementById('erode');
  function fit(){
    var size=parseFloat(getComputedStyle(logo).fontSize);
    erode.setAttribute('radius',(size*1.5/168).toFixed(2));
  }
  fit();
  window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
