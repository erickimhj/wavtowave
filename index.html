<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wavtowave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap">
<style>
html,body{margin:0;height:100%}
body{
  background:#0e0e10;color:#D8D2C4;
  font-family:'Libre Caslon Display',Georgia,serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;
}
.stage{display:flex;flex-direction:column;align-items:center;opacity:0;animation:fade 1.6s ease forwards}
@keyframes fade{to{opacity:1}}
.logo{
  font:inherit;font-weight:400;
  font-size:clamp(52px,13vw,168px);
  letter-spacing:-0.01em;line-height:1;
  color:#D8D2C4;background:none;border:0;cursor:pointer;
  padding:24px;
  filter:url(#thin);
  transition:color .4s ease, transform .7s cubic-bezier(.2,.7,.2,1);
}
.logo:hover{color:#FFFFFF}
.logo:focus-visible{outline:1px solid #D8D2C4;outline-offset:4px}
.menu{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .7s ease, opacity .6s ease .15s, margin .7s ease;
}
.menu a{
  color:#D8D2C4;text-decoration:none;
  font-size:18px;letter-spacing:0.04em;line-height:1.2;
  padding:6px 16px;
  transition:color .3s ease;
}
.menu a:hover{color:#FFFFFF}
.menu a:focus-visible{outline:1px solid #D8D2C4;outline-offset:4px}
body.open .logo{transform:translateY(-12px) scale(.82)}
body.open .menu{max-height:200px;opacity:1;margin-top:8px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="thin" x="-5%" y="-20%" width="110%" height="140%">
    <feMorphology id="erode" operator="erode" radius="1.5"></feMorphology>
  </filter>
</svg>

<div class="stage">
  <button class="logo" type="button" aria-expanded="false" aria-controls="menu">wavtowave</button>
  <nav class="menu" id="menu" aria-label="메뉴">
    <a href="artists.html" tabindex="-1">ARTISTS</a>
    <a href="release.html" tabindex="-1">NEW RELEASE</a>
    <a href="https://www.instagram.com/wavtowave_/" target="_blank" rel="noopener" tabindex="-1">INSTAGRAM</a>
  </nav>
</div>

<script>
(function(){
  var logo=document.querySelector('.logo');
  var erode=document.getElementById('erode');
  var links=document.querySelectorAll('.menu a');
  // 화면 크기에 맞춰 로고 얇기도 같은 비율로 조절
  function fit(){
    var size=parseFloat(getComputedStyle(logo).fontSize);
    erode.setAttribute('radius',(size*1.5/168).toFixed(2));
  }
  fit();
  window.addEventListener('resize',fit);
  // 로고를 누르면 메뉴 열기/닫기
  logo.addEventListener('click',function(){
    var open=document.body.classList.toggle('open');
    logo.setAttribute('aria-expanded',open);
    links.forEach(function(a){a.tabIndex=open?0:-1});
  });
})();

// 첫 화면을 보는 동안 곡 목록·아티스트 목록·프로필 사진을 미리 받아둠 (다음 페이지가 바로 뜨도록)
(function(){
  var BASE='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjPezBbHYtf8v2DaQJN0IDbRAXX_GpPsnjsetFzSvAz0JPGmaJVq_qfTdZ7HqMKKt8_CE3jO_uK_EK/pub?single=true&output=csv&gid=';
  function save(key,gid,after){
    fetch(BASE+gid+'&t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
      try{localStorage.setItem(key,t)}catch(e){}
      if(after)after(t);
    }).catch(function(){});
  }
  // 사진·커버 칸의 구글 드라이브 이미지를 미리 받아둠
  function preload(t,col){
    var lines=t.replace(/^﻿/,'').split('\n');
    var head=lines[0].split(',').map(function(x){return x.trim()});
    var pi=head.indexOf(col); if(pi<0) return;
    var sz=col==='커버'?'w1000':'w320';
    lines.slice(1).forEach(function(l){
      var m=(l.split(',')[pi]||'').match(/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]+)/);
      if(m) new Image().src='https://drive.google.com/thumbnail?id='+m[1]+'&sz='+sz;
    });
  }
  var RELEASE_GID='640589778'; // 구글 시트 release 탭 번호
  save('wtw_artists','660942977',function(t){preload(t,'사진')});
  if(RELEASE_GID) save('wtw_release',RELEASE_GID,function(t){preload(t,'커버')});
})();
</script>
</body>
</html>
