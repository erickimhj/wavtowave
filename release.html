<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="아티스트의 다양성으로 새로운 음악의 파동을 만들어가는 레이블">
<meta property="og:type" content="website">
<meta property="og:site_name" content="wavtowave">
<meta property="og:title" content="wavtowave - New Release">
<meta property="og:description" content="아티스트의 다양성으로 새로운 음악의 파동을 만들어가는 레이블">
<meta property="og:url" content="http://wavtowave.kro.kr/release.html">
<meta property="og:image" content="http://wavtowave.kro.kr/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>wav to wave - New Release</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e0e10;color:#e8e8ea;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:48px 16px 64px}
h1{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;font-size:40px;letter-spacing:-0.01em;line-height:1;color:#D8D2C4;margin:0 0 10px}
.home{color:inherit;text-decoration:none;transition:color .3s}
.home:hover{color:#FFFFFF}
.home{display:inline-block;filter:url(#thin);view-transition-name:wtw-logo}
/* 페이지 이동 시 로고가 자연스럽게 이어지는 애니메이션 (지원하는 브라우저에서만, 나머지는 기존처럼 바로 이동) */
@view-transition{navigation:auto}
::view-transition-group(wtw-logo){animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.sub{color:#8a8a93;margin:0 0 28px}
/* 카드 개수와 상관없이 항상 가운데 정렬 */
:root{--cover:360px}
.list{display:flex;flex-direction:column;align-items:center;gap:20px}
.card{width:min(100%,calc(var(--cover) + 40px));border:1px solid #232329;border-radius:12px;padding:20px 20px 18px;background:#151518;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.cover{width:100%;height:auto;aspect-ratio:1/1;border-radius:6px;object-fit:cover;background:#222227;display:flex;align-items:center;justify-content:center;font-size:48px;color:#8a8a93}
a.coverlink{display:block;width:100%;border-radius:6px}
a.coverlink .cover{transition:opacity .2s}
a.coverlink:hover .cover{opacity:.8}
a.coverlink:focus-visible{outline:1px solid #e8e8ea;outline-offset:4px}
.title{font-weight:600;font-size:18px;word-break:break-all}
.artist{font-size:14px;color:#b5b5bd;margin-top:-6px;word-break:break-all}
.sp{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:10px;color:#e8e8ea;font-size:13px;text-decoration:none;opacity:.85;transition:opacity .2s}
.sp:hover{opacity:1}
.sp img{width:26px;height:26px;display:block}
.links{display:flex;align-items:center;justify-content:center;gap:10px}
.mv{display:inline-flex;align-items:center;justify-content:center;height:36px;line-height:1;padding:0 16px;border:1px solid #2c2c33;border-radius:999px;color:#e8e8ea;font-size:13px;font-weight:600;text-decoration:none}
.mv:hover{background:#222227}
.msg{color:#8a8a93;padding:20px 0;text-align:center;width:100%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="thin" x="-5%" y="-20%" width="110%" height="140%"><feMorphology operator="erode" radius="0.4"></feMorphology></filter></svg>
<div class="wrap">
<h1><a class="home" href="./" aria-label="wavtowave 첫 화면으로">wavtowave</a></h1>
<p class="sub">New Release</p>
<div class="list" id="list"><p class="msg">불러오는 중...</p></div>
</div>
<script>
// 구글 시트 release 탭의 번호(gid)
var RELEASE_GID='640589778';
var BASE='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjPezBbHYtf8v2DaQJN0IDbRAXX_GpPsnjsetFzSvAz0JPGmaJVq_qfTdZ7HqMKKt8_CE3jO_uK_EK/pub?single=true&output=csv&gid=';

function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!='\r')f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}
function esc(s){return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function photoUrl(u){
  u=(u||'').trim(); if(!u) return '';
  var m=u.match(/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]+)/);
  return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':u;
}
function show(html){document.getElementById('list').innerHTML=html}
// 지난번에 받아둔 목록을 먼저 바로 보여주고, 그사이 최신 목록을 받아와 바뀐 게 있으면 교체
function cached(key,url,load,fail){var c=null;try{c=localStorage.getItem(key)}catch(e){}
if(c){try{load(c)}catch(e){c=null}}
fetch(url+'&t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
if(t!==c){try{localStorage.setItem(key,t)}catch(e){}load(t)}}).catch(function(){if(!c)fail()})}

function card(r){
  var sp=/^https:\/\/open\.spotify\.com\//.test(r.sp)?r.sp:'';
  var mv=/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(r.mv)?r.mv:'';
  var cover=r.cover?'<img class="cover" src="'+esc(r.cover)+'" alt="'+esc(r.title)+' 앨범 커버" loading="lazy">'
                   :'<span class="cover" aria-hidden="true">'+esc(r.title.charAt(0).toUpperCase())+'</span>';
  if(sp) cover='<a class="coverlink" href="'+esc(sp)+'" target="_blank" rel="noopener">'+cover+'</a>';
  return '<div class="card">'+cover+'<div class="title">'+esc(r.title)+'</div>'
    +(r.artist?'<div class="artist">'+esc(r.artist)+'</div>':'')
    +((sp||mv)?'<div class="links">'
      +(sp?'<a class="sp" href="'+esc(sp)+'" target="_blank" rel="noopener" aria-label="'+esc(r.title)+' Spotify"><img src="spotify.png" alt="Spotify" onerror="this.replaceWith(document.createTextNode(\'spotify\'))"></a>':'')
      +(mv?'<a class="mv" href="'+esc(mv)+'" target="_blank" rel="noopener" aria-label="'+esc(r.title)+' 뮤직비디오">MV</a>':'')
      +'</div>':'')
    +'</div>';
}

if(!RELEASE_GID){
  show('<p class="msg">새 앨범을 준비 중입니다.</p>');
}else{
  cached('wtw_release',BASE+RELEASE_GID,function(txt){
    var rows=parseCSV(txt.replace(/^﻿/,''));
    var head=rows.shift().map(function(s){return s.trim()});
    var ci=head.indexOf('커버'),ti=head.indexOf('제목'),ai=head.indexOf('아티스트'),si=head.indexOf('스포티파이'),mi=head.map(function(h){return h.toUpperCase()}).indexOf('MV');
    var list=[];
    rows.forEach(function(r){
      var title=(r[ti]||'').trim(); if(!title) return;
      list.push({title:title,cover:photoUrl(r[ci]),artist:ai<0?'':(r[ai]||'').trim(),sp:si<0?'':(r[si]||'').trim(),mv:mi<0?'':(r[mi]||'').trim()});
    });
    show(list.length?list.map(card).join(''):'<p class="msg">아직 등록된 앨범이 없습니다.</p>');
  },function(){show('<p class="msg">목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>')});
}
</script>
</body>
</html>
